[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webtest-kit"
version = "0.1.0"
description = "A framework for automated functional testing of web applications"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["testing", "automation", "playwright", "pytest", "web"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "pytest>=8.2.0",
    "pytest-playwright>=0.5.0",
    "pytest-html>=4.1.1",
    "allure-pytest>=2.13.5",
    "httpx>=0.27.0",
    "pydantic>=2.7.1",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "rich>=13.7.1",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "hatch>=1.12.0",
]

[project.scripts]
webtest-kit = "webtest_kit.cli:main"

[project.urls]
Homepage = "https://github.com/kaplunovAlexander/webtest-kit"
Documentation = "https://github.com/kaplunovAlexander/webtest-kit/docs"
Repository = "https://github.com/kaplunovAlexander/webtest-kit"
Issues = "https://github.com/kaplunovAlexander/webtest-kit/issues"

[tool.hatch.build.targets.wheel]
packages = ["webtest_kit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "api: API tests via httpx",
    "e2e: browser tests via Playwright",
    "slow: slow tests",
]